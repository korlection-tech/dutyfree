<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>韓國免稅店代購 (3 - 7 Jun 2026) 價格查詢系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        
        /* 頂部區塊 */
        .header-section {
            text-align: center;
            margin-bottom: 25px;
        }
        .company-logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border: 2px solid #fff;
        }
        h1 {
            color: #1a1a1a;
            margin: 0 0 12px 0;
            font-size: 26px;
            font-weight: 700;
            line-height: 1.4;
        }
        .subtitle {
            color: #4a5568;
            margin: 0 0 6px 0;
            font-size: 15px;
            font-weight: 600;
        }
        .notice-text {
            color: #e53e3e;
            font-size: 13px;
            margin: 0;
            font-weight: 500;
        }
        
        /* 狀態提示列 */
        .status-message {
            text-align: center;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
        }
        .status-loading { background: #fff3cd; color: #856404; }
        .status-error { background: #f8d7da; color: #721c24; }

        /* 搜尋區 */
        .search-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            margin-bottom: 30px;
        }
        label { font-weight: 600; display: block; margin-bottom: 10px; color: #2c3e50; font-size: 16px; }
        textarea {
            width: 100%; height: 90px; padding: 12px; border: 2px solid #ced4da;
            border-radius: 6px; font-size: 16px; resize: vertical; box-sizing: border-box;
            font-family: inherit;
        }
        textarea:focus { border-color: #001f3f; outline: none; }
        .hint { font-size: 13px; color: #6c757d; margin-top: 8px; }
        
        /* Navy 按鈕 */
        .btn-search {
            display: block; width: 100%; padding: 14px; 
            background-color: #001f3f; color: white;
            border: none; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer;
            margin-top: 15px; transition: background 0.2s;
            font-family: inherit;
        }
        .btn-search:hover { background-color: #001124; }
        .btn-search:disabled { background-color: #a0aec0; cursor: not-allowed; }

        /* Grid 與商品卡片 */
        .results-count { margin-bottom: 15px; font-weight: bold; color: #2c3e50; font-size: 16px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card {
            background: #fff; border: 1px solid #e1e8ed; border-radius: 8px; overflow: hidden;
            display: flex; flex-direction: column; padding: 15px; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 16px rgba(0,0,0,0.08); }
        .image-container { width: 100%; height: 180px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
        .card img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .brand-badge { background: #eef2f7; color: #4a5568; font-size: 11px; padding: 4px 8px; border-radius: 4px; align-self: flex-start; margin-bottom: 8px; font-weight: bold; text-transform: uppercase; }
        .product-name { font-size: 14px; font-weight: 600; color: #2d3748; margin: 0 0 12px 0; height: 40px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.4; }
        .price-wrapper { margin-top: auto; border-top: 1px dashed #edf2f7; padding-top: 10px; display: flex; justify-content: space-between; align-items: center; }
        .price-label { font-size: 12px; color: #718096; }
        .price { font-size: 18px; color: #e53e3e; font-weight: bold; }
        .no-result { text-align: center; color: #a0aec0; grid-column: 1 / -1; padding: 50px; font-size: 16px; }
        .click-tip { font-size: 11px; color: #3498db; text-align: right; margin-top: 2px; }

        /* Modal 彈出視窗（終極修正層次樣式） */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); display: flex; align-items: center;
            justify-content: center; z-index: 99999; opacity: 0; pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: #fff; width: 90%; max-width: 600px; max-height: 85vh;
            border-radius: 14px; padding: 30px 25px 25px 25px; position: relative; overflow-y: auto;
            box-shadow: 0 12px 30px rgba(0,0,0,0.25); transform: scale(0.9); transition: transform 0.2s ease;
        }
        .modal-overlay.active .modal-content { transform: scale(1); }
        
        /* 關閉按鈕：提升至最高極限，獨立懸浮，點擊必中 */
        .close-btn {
            position: absolute; top: 8px; right: 18px; font-size: 38px;
            color: #999; cursor: pointer; border: none; background: none; font-weight: bold; 
            z-index: 999999 !important; padding: 5px; line-height: 1; transition: color 0.2s;
        }
        .close-btn:hover { color: #000; }
        
        .modal-image-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            background: #fafafa;
            margin-bottom: 15px;
            border-radius: 6px;
            overflow: hidden;
        }
        .modal-image-container img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0;
            padding: 0;
            border: none;
        }
        
        .modal-brand { font-size: 13px; color: #001f3f; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }
        .modal-title { font-size: 18px; font-weight: bold; color: #1a1a1a; margin: 0 0 15px 0; line-height: 1.4; }
        .modal-price-box { background: #fff5f5; padding: 12px 15px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .modal-price-label { font-size: 14px; color: #c53030; font-weight: 600; }
        .modal-price { font-size: 24px; color: #e53e3e; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <img src="logo.png" alt="Company Logo" class="company-logo" onerror="this.style.display='none'">
        <h1>韓國免稅店代購<br>(3 - 7 Jun 2026)</h1>
        <div class="subtitle">每次最多可同時查詢 10 個品牌</div>
        <p class="notice-text">*價格可能會因免稅店的促銷優惠而有所變動，請於落單前與店主確認價格</p>
    </div>
    
    <div id="statusMessage" class="status-message status-loading">⏳ 正在連線讀取免稅店產品資料庫，請稍候...</div>

    <div class="search-box">
        <label for="searchInput">請輸入查詢關鍵字（多個請用「空格」或「換行」隔開）：</label>
        <textarea id="searchInput" placeholder="例如輸入: 2AN AMUSE"></textarea>
        <div class="hint">
            <span id="brandCountHint">已輸入: 0 個關鍵字 / 上限 10 個</span>
        </div>
        <button class="btn-search" id="searchBtn" onclick="performSearch()" disabled>請稍候...</button>
    </div>

    <div class="results-count" id="resultsCount"></div>
    <div class="grid" id="resultsGrid"></div>
</div>

<div class="modal-overlay" id="detailModal">
    <div class="modal-content">
        <button class="close-btn" id="globalCloseBtn" type="button">&times;</button>
        
        <div class="modal-image-container" id="modalImgContainer"></div>
        
        <div id="modalBrand" class="modal-brand">BRAND</div>
        <h2 id="modalTitle" class="modal-title">產品名稱項目</h2>
        <div class="modal-price-box">
            <span class="modal-price-label">免稅優惠價</span>
            <span class="modal-price" id="modalPrice">HKD $0</span>
        </div>
    </div>
</div>

<script>
let productsData = []; 

document.addEventListener("DOMContentLoaded", function() {
    const cacheBuster = "?v=" + new Date().getTime();
    
    const possibleNames = [
        "pricelist.csv" + cacheBuster,
        "Duty Free Pricelist.csv" + cacheBuster,
        "Duty%20Free%20Pricelist.csv" + cacheBuster
    ];
    
    let attemptIndex = 0;

    function tryLoadCSV() {
        if (attemptIndex >= possibleNames.length) {
            const statusDiv = document.getElementById("statusMessage");
            statusDiv.className = "status-message status-error";
            statusDiv.innerText = "❌ 錯誤：找不到您的 CSV 資料庫檔案。請確保資料庫檔案（如 pricelist.csv）與 index.html 放喺 GitHub 嘅同一個根目錄資料夾。";
            return;
        }

        const currentName = possibleNames[attemptIndex];
        
        Papa.parse(currentName, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                productsData = results.data;
                document.getElementById("statusMessage").style.display = "none";
                
                const searchBtn = document.getElementById("searchBtn");
                searchBtn.disabled = false;
                searchBtn.innerText = "立即查詢價格";
            },
            error: function(err) {
                attemptIndex++;
                tryLoadCSV();
            }
        });
    }

    tryLoadCSV();

    // 💡 終極優化：全域點擊事件監聽器，強制關閉視窗，絕不失靈
    const modalOverlay = document.getElementById('detailModal');
    const closeBtn = document.getElementById('globalCloseBtn');

    if (closeBtn) {
        closeBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            modalOverlay.classList.remove('active');
        });
    }

    if (modalOverlay) {
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
            }
        });
    }
});

document.getElementById('searchInput').addEventListener('input', function() {
    let keywords = parseKeywords(this.value);
    let hint = document.getElementById('brandCountHint');
    hint.innerText = `已輸入: ${keywords.length} 個關鍵字 / 上限 10 個`;
    hint.style.color = keywords.length > 10 ? '#e53e3e' : '#6c757d';
    hint.style.fontWeight = keywords.length > 10 ? 'bold' : 'normal';
});

function parseKeywords(text) {
    if (!text.trim()) return [];
    return text.split(/[\n,，\s]+/).filter(k => k.trim() !== "");
}

function performSearch() {
    const rawInput = document.getElementById('searchInput').value;
    let keywords = parseKeywords(rawInput);
    
    if (keywords.length === 0) { alert("請至少輸入一個品牌或關鍵字。"); return; }
    if (keywords.length > 10) { alert("⚠️ 每次最多只能同時查詢 10 個品牌/關鍵字！\n系統將自動抓取前 10 個進行搜尋。"); keywords = keywords.slice(0, 10); }
    
    const grid = document.getElementById('resultsGrid');
    const countDiv = document.getElementById('resultsCount');
    grid.innerHTML = ''; 
    
    const filtered = productsData.filter(product => {
        return keywords.some(keyword => {
            const k = keyword.toLowerCase().trim();
            const brandMatch = product["Brand"] ? product["Brand"].toLowerCase().includes(k) : false;
            const nameMatch = product["Product Name"] ? product["Product Name"].toLowerCase().includes(k) : false;
            return brandMatch || nameMatch;
        });
    });
    
    countDiv.innerText = `🔍 找到 ${filtered.length} 筆相關商品 (基於 ${keywords.length} 個關鍵字：${keywords.join(', ')})`;
    
    if (filtered.length === 0) {
        grid.innerHTML = '<div class="no-result">沒有找到相符的商品，請檢查拼字或更換關鍵字。</div>';
    } else {
        filtered.forEach(item => {
            const brand = item["Brand"] || "Unknown";
            const name = item["Product Name"] || "無品名";
            const price = item["Price (HKD)"] || "未定價";
            const imgUrl = item["Image"] || "";
            const detailImgUrl = item["Detail Image"] && item["Detail Image"].trim() !== "" ? item["Detail Image"] : imgUrl;
            
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openModal(brand, name, price, detailImgUrl);
            
            card.innerHTML = `
                <div class="image-container">
                    <img src="${imgUrl}" alt="${name}" onerror="this.src='https://placehold.co/200x200?text=No+Image'">
                </div>
                <div class="brand-badge">${brand}</div>
                <div class="product-name" title="${name}">${name}</div>
                <div class="price-wrapper">
                    <span class="price-label">價格</span>
                    <span class="price">HKD $${price}</span>
                </div>
                <div class="click-tip">🔍 點擊看細節</div>
            `;
            grid.appendChild(card);
        });
    }
}

function openModal(brand, name, price, detailImgRaw) {
    const container = document.getElementById('modalImgContainer');
    container.innerHTML = ''; 
    
    const imgList = detailImgRaw.split(';').join(',').split(',').map(url => url.trim()).filter(url => url !== "");
    
    imgList.forEach((url, index) => {
        const img = document.createElement('img');
        img.src = url;
        
        img.onerror = function() {
            if (imgList.length === 1) {
                this.src = 'https://placehold.co/400x400?text=No+Detail+Image';
            } else {
                this.style.display = 'none';
            }
        };
        container.appendChild(img);
    });

    document.getElementById('modalBrand').innerText = brand;
    document.getElementById('modalTitle').innerText = name;
    document.getElementById('modalPrice').innerText = "HKD $" + price;
    
    const modal = document.getElementById('detailModal');
    modal.classList.add('active');
    
    document.querySelector('.modal-content').scrollTop = 0;
}
</script>

</body>
</html>
