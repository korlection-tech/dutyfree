<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>免稅化妝品價格查詢系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: #1a1a1a;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .search-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            margin-bottom: 30px;
        }
        label {
            font-weight: 600;
            display: block;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        textarea {
            width: 100%;
            height: 90px;
            padding: 12px;
            border: 2px solid #ced4da;
            border-radius: 6px;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        textarea:focus {
            border-color: #4a90e2;
            outline: none;
        }
        .hint {
            font-size: 13px;
            color: #6c757d;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
        }
        .btn-search {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn-search:hover {
            background-color: #357abd;
        }
        .status-message {
            text-align: center;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            font-size: 14px;
            display: none;
        }
        .status-loading { background: #fff3cd; color: #856404; display: block; }
        .status-success { background: #d4edda; color: #155724; }
        .status-error { background: #f8d7da; color: #721c24; display: block; }

        .results-count {
            margin-bottom: 15px;
            font-weight: bold;
            color: #2c3e50;
            font-size: 16px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .card {
            background: #fff;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
        }
        .image-container {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            background: #fff;
        }
        .card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .brand-badge {
            background: #eef2f7;
            color: #4a5568;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            align-self: flex-start;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .product-name {
            font-size: 14px;
            font-weight: 600;
            color: #2d3748;
            margin: 0 0 12px 0;
            height: 40px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            line-height: 1.4;
        }
        .price-wrapper {
            margin-top: auto;
            border-top: 1px dashed #edf2f7;
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .price-label {
            font-size: 12px;
            color: #718096;
        }
        .price {
            font-size: 18px;
            color: #e53e3e;
            font-weight: bold;
        }
        .no-result {
            text-align: center;
            color: #a0aec0;
            grid-column: 1 / -1;
            padding: 50px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>免稅商品價格查詢系統</h1>
    <div class="subtitle">輸入品牌或關鍵字，每次最多可同時查詢 10 個</div>
    
    <div id="statusMessage" class="status-message status-loading">正在載入 Duty Free Pricelist.csv 資料庫...</div>

    <div class="search-box">
        <label for="searchInput">請輸入查詢關鍵字（多個請用「空格」或「換行」隔開）：</label>
        <textarea id="searchInput" placeholder="例如輸入: 2AN AMUSE (系統會同時找出這兩個品牌的所有產品)"></textarea>
        <div class="hint">
            <span id="brandCountHint">已輸入: 0 個關鍵字 / 上限 10 個</span>
            <span>支援品牌名或商品名模糊搜尋</span>
        </div>
        <button class="btn-search" id="searchBtn" onclick="performSearch()" disabled>請等待資料載入...</button>
    </div>

    <div class="results-count" id="resultsCount"></div>
    <div class="grid" id="resultsGrid"></div>
</div>

<script>
let productsData = []; // 存放從 CSV 解析出來的產品資料庫

// 網頁開啟時，自動讀取同資料夾底下的 Duty Free Pricelist.csv
document.addEventListener("DOMContentLoaded", function() {
    const csvFileName = "Duty Free Pricelist.csv"; // 確保你的 CSV 檔名完全一致
    
    Papa.parse(csvFileName, {
        download: true,
        header: true, // 自動將第一行視為欄位名稱 (Brand, Product Name, Price (HKD), Image)
        skipEmptyLines: true,
        complete: function(results) {
            productsData = results.data;
            showStatus("資料庫載入成功！共匯入 " + productsData.length + " 筆商品。", "success");
            document.getElementById("searchBtn").disabled = false;
            document.getElementById("searchBtn").innerText = "立即查詢價格";
        },
        error: function(err) {
            showStatus("錯誤：無法讀取 " + csvFileName + "。請確保網頁與 CSV 放在同一個伺服器或環境下運行。", "error");
            console.error(err);
        }
    });
});

// 監聽輸入框，即時計算關鍵字數量
document.getElementById('searchInput').addEventListener('input', function() {
    let keywords = parseKeywords(this.value);
    let hint = document.getElementById('brandCountHint');
    hint.innerText = `已輸入: ${keywords.length} 個關鍵字 / 上限 10 個`;
    
    if(keywords.length > 10) {
        hint.style.color = '#e53e3e';
        hint.style.fontWeight = 'bold';
    } else {
        hint.style.color = '#6c757d';
        hint.style.fontWeight = 'normal';
    }
});

// 解析輸入框的文字（支援空格、逗號、換行切分）
function parseKeywords(text) {
    if (!text.trim()) return [];
    return text.split(/[\n,，\s]+/).filter(k => k.trim() !== "");
}

// 狀態列提示控制
function showStatus(msg, type) {
    const statusDiv = document.getElementById("statusMessage");
    statusDiv.className = "status-message status-" + type;
    statusDiv.innerText = msg;
    statusDiv.style.display = "block";
}

// 執行搜尋邏輯
function performSearch() {
    const rawInput = document.getElementById('searchInput').value;
    let keywords = parseKeywords(rawInput);
    
    if (keywords.length === 0) {
        alert("請至少輸入一個品牌或關鍵字。");
        return;
    }
    
    // 嚴格限制 10 個關鍵字
    if (keywords.length > 10) {
        alert("⚠️ 每次最多只能同時查詢 10 個品牌/關鍵字！\n系統將自動抓取前 10 個進行搜尋。");
        keywords = keywords.slice(0, 10);
    }
    
    const grid = document.getElementById('resultsGrid');
    const countDiv = document.getElementById('resultsCount');
    grid.innerHTML = ''; // 清空上一次的搜尋結果
    
    // 篩選邏輯：產品的 Brand 或 Product Name 包含任意一個輸入的關鍵字即可
    const filtered = productsData.filter(product => {
        return keywords.some(keyword => {
            const k = keyword.toLowerCase().trim();
            // 這裡對應你 CSV 的欄位名稱
            const brandMatch = product["Brand"] ? product["Brand"].toLowerCase().includes(k) : false;
            const nameMatch = product["Product Name"] ? product["Product Name"].toLowerCase().includes(k) : false;
            return brandMatch || nameMatch;
        });
    });
    
    // 顯示篩選結果統計
    countDiv.innerText = `🔍 找到 ${filtered.length} 筆相關商品 (基於 ${keywords.length} 個關鍵字：${keywords.join(', ')})`;
    
    // 開始渲染商品卡片
    if (filtered.length === 0) {
        grid.innerHTML = '<div class="no-result">沒有找到相符的商品，請檢查拼字或更換關鍵字。</div>';
    } else {
        filtered.forEach(item => {
            // 處理 CSV 欄位，防止因為空格導致讀不到
            const brand = item["Brand"] || "Unknown";
            const name = item["Product Name"] || "無品名";
            const price = item["Price (HKD)"] || "未定價";
            const imgUrl = item["Image"] || "";
            
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="image-container">
                    <img src="${imgUrl}" alt="${name}" onerror="this.src='https://placehold.co/200x200?text=No+Image'">
                </div>
                <div class="brand-badge">${brand}</div>
                <div class="product-name" title="${name}">${name}</div>
                <div class="price-wrapper">
                    <span class="price-label">價格</span>
                    <span class="price">HKD $${price}</span>
                </div>
            `;
            grid.appendChild(card);
        });
    }
}
</script>

</body>
</html>
