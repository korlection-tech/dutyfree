        }
        
        /* 頂部區塊 */

        textarea {

        }
        textarea:focus { border-color: #001f3f; outline: none; }
        .hint { font-size: 13px; color: #6c757d; margin-top: 8px; display: flex; justify-content: space-between; }
        
        /* Navy 按鈕 */

        .btn-search:hover { background-color: #001124; }
        .btn-search:disabled { background-color: #a0aec0; cursor: not-allowed; }

            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 16px rgba(0,0,0,0.08); }
        .image-container { width: 100%; height: 180px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
        .card img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .brand-badge { background: #eef2f7; color: #4a5568; font-size: 11px; padding: 4px 8px; border-radius: 4px; align-self: flex-start; margin-bottom: 8px; font-weight: bold; text-transform: uppercase; }
        .product-name { font-size: 14px; font-weight: 600; color: #2d3748; margin: 0 0 12px 0; height: 40px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.4; }

        .price { font-size: 18px; color: #e53e3e; font-weight: bold; }
        .no-result { text-align: center; color: #a0aec0; grid-column: 1 / -1; padding: 50px; font-size: 16px; }
        .click-tip { font-size: 11px; color: #3498db; text-align: right; margin-top: 2px; }

        /* Modal 彈出視窗（已優化長圖滾動） */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;

            justify-content: center; z-index: 9999; opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-content {
            background: #fff; width: 90%; max-width: 600px; max-height: 85vh;
            border-radius: 12px; padding: 25px; position: relative; 
            overflow-y: auto; /* 當圖片好長嗰陣，等個視窗自己出滾動條 */
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); transform: scale(0.8); transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-content { transform: scale(1); }
        
        /* 懸浮固定的關閉按鈕，等用家拉到好落都隨時撳到關閉 */
        .close-btn {

            font-weight: bold; width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2); z-index: 99;
        }
        .close-btn:hover { color: #000; background: #fff; }
        
        /* 🛠️ 核心修改：移除 max-height 限制，等長圖可以自動 100% 寬度放大放大 */
        .modal-detail-img { 
            width: 100%;

            margin-bottom: 15px; 
            border-radius: 6px; 
            display: block;
        }
