<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>免稅品價格快捷查詢系統</title>
    <style>
        :root {
            --primary-color: #007aff;
            --success-color: #34c759;
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 650px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 5px;
            color: #1d1d1f;
        }
        .subtitle {
            text-align: center;
            color: #86868b;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .system-status {
            text-align: center;
            font-size: 13px;
            color: #86868b;
            margin-bottom: 20px;
            padding: 10px;
            background: #fafafa;
            border-radius: 8px;
            font-weight: 500;
        }
        .search-box {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        textarea {
            width: 100%;
            height: 140px;
            padding: 14px;
            border: 1px solid #d2d2d7;
            border-radius: 10px;
            font-size: 16px;
            resize: none;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
        }
        .hint {
            font-size: 12px;
            color: #86868b;
            margin-top: 6px;
        }
        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover:not(:disabled) {
            background-color: #0066cc;
        }
        button:disabled {
            background-color: #d2d2d7;
            cursor: not-allowed;
        }
        .results-container {
            margin-top: 25px;
        }
        .result-item {
            padding: 15px 0;
            border-bottom: 1px solid #e5e5ea;
        }
        .keyword-header {
            margin-bottom: 10px;
        }
        .result-row {
            display: flex;
            align-items: center;
            margin-top: 10px;
            padding: 12px;
            background: #fbfbfd;
            border-radius: 10px;
            gap: 15px;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.02);
        }
        .img-wrapper {
            width: 75px;
            height: 75px;
            background: #fff;
            border: 1px solid #e5e5ea;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .prod-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .prod-info {
            flex-grow: 1;
        }
        .search-keyword {
            font-size: 12px;
            color: #007aff;
            background: rgba(0, 122, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            font-weight: 500;
        }
        .prod-brand {
            font-size: 11px;
            color: #007aff;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .prod-name {
            font-weight: 500;
            word-break: break-word;
            padding-right: 10px;
            font-size: 14px;
            color: #1d1d1f;
            line-height: 1.4;
        }
        .prod-price {
            font-size: 18px;
            font-weight: bold;
            color: #ff3b30;
            white-space: nowrap;
            text-align: right;
        }
        .price-currency {
            font-size: 12px;
            font-weight: normal;
            margin-right: 2px;
        }
        .error-msg {
            color: #ff3b30;
            background: #fff2f1;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>免稅品價格查詢系統</h1>
    <div class="subtitle">輸入關鍵字，隨時同步最新雲端價格</div>

    <div class="system-status" id="systemStatus">⏳ 正在連線至雲端數據庫...</div>
    <div class="error-msg" id="errorMsg"></div>

    <div class="search-box">
        <label for="keywords">請輸入產品關鍵字 (每行一項)：</label>
        <textarea id="keywords" placeholder="例如：&#10;2AN&#10;AMUSE&#10;Palette"></textarea>
        <div class="hint" id="lineCount">目前輸入：0 / 10 項</div>
    </div>

    <button id="searchBtn" onclick="searchPrices()" disabled>請稍候...</button>

    <div class="results-container" id="results"></div>
</div>
