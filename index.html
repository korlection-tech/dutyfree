<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>免稅商品價格查詢系統 v2.1</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: #1a1a1a;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .upload-zone {
            border: 2px dashed #4a90e2;
            background: #f8fbc9;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 25px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .upload-zone:hover {
            background: #f1f7b5;
        }
        .upload-zone p {
            margin: 5px 0;
            color: #2c3e50;
            font-weight: bold;
        }
        #fileInput {
            display: none;
        }
        .search-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            margin-bottom: 30px;
            opacity: 0.5;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .search-box.active {
            opacity: 1;
            pointer-events: auto;
        }
        label {
            font-weight: 600;
            display: block;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        textarea {
            width: 100%;
            height: 90px;
            padding: 12px;
            border: 2px solid #ced4da;
            border-radius: 6px;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
        }
        textarea:focus {
            border-color: #4a90e2;
            outline: none;
        }
        .hint {
            font-size: 13px;
            color: #6c757d;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
        }
        .btn-row {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        .btn-search,
        .btn-ig-gen {
            padding: 14px;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }
        .btn-search {
            flex: 2;
            background-color: #4a90e2;
        }
        .btn-search:hover {
            background-color: #357abd;
            transform: translateY(-2px);
        }
        .btn-ig-gen {
            flex: 1;
            background: linear-gradient(135deg, #ff5c9b, #ec2875);
            box-shadow: 0 6px 14px rgba(236, 40, 117, 0.20);
        }
        .btn-ig-gen:hover {
            transform: translateY(-2px);
        }
        .results-count {
            margin-bottom: 15px;
            font-weight: bold;
            color: #2c3e50;
            font-size: 16px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .card {
            background: #fff;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
        }
        .image-container {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            background: #fff;
        }
        .card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .brand-badge {
            background: #eef2f7;
            color: #4a5568;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            align-self: flex-start;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .product-name {
            font-size: 14px;
            font-weight: 600;
            color: #2d3748;
            margin: 0 0 12px 0;
            height: 40px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            line-height: 1.4;
        }
        .price-wrapper {
            margin-top: auto;
            border-top: 1px dashed #edf2f7;
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .price-label {
            font-size: 12px;
            color: #718096;
        }
        .price {
            font-size: 18px;
            color: #e53e3e;
            font-weight: bold;
        }
        .no-result {
            text-align: center;
            color: #a0aec0;
            grid-column: 1 / -1;
            padding: 50px;
            font-size: 16px;
        }

        /* IG poster */
        #renderCanvasHidden {
            position: fixed;
            left: -10000px;
            top: 0;
            opacity: 0;
            pointer-events: none;
        }
        .ig-poster {
            width: 1080px;
            height: 1350px;
            background: #fff;
            display: grid;
            grid-template-columns: 540px 540px;
            grid-template-rows: 675px 675px;
        }
        .ig-cell {
            position: relative;
            width: 540px;
            height: 675px;
            overflow: hidden;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ig-cell img {
            max-width: 96%;
            max-height: 72%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            margin: auto;
        }
        .ig-top-left {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            z-index: 10;
            background: #fff;
            color: #000;
            font-size: 17px;
            font-weight: 800;
            line-height: 1.25;
            text-align: left;
            word-break: break-word;
            white-space: normal;
        }
        .ig-brand {
            font-size: 13px;
            font-weight: 900;
            color: #1D63FF;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .ig-price-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: #fff;
            color: #000;
            padding: 9px 22px;
            text-align: center;
            white-space: nowrap;
        }
        .ig-price {
            font-size: 26px;
            font-weight: 900;
            color: #e11d48;
            line-height: 1.1;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>免稅商品價格查詢系統</h1>
    <div class="subtitle">步驟 1：載入 CSV 檔案 ➔ 步驟 2：輸入關鍵字查價／一鍵生成 Featured IG 圖</div>

    <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <p id="uploadStatus">📁 點擊這裡 或 把「Duty Free Pricelist.csv」拖到這裡載入資料庫</p>
        <span style="font-size: 12px; color: #666;">(資料純網頁解析，絕不會上傳到任何外部伺服器，安全保密)</span>
        <input type="file" id="fileInput" accept=".csv">
    </div>

    <div class="search-box" id="searchBox">
        <label for="searchInput">請輸入查詢關鍵字（多個請用「空格」或「換行」隔開）：</label>
        <textarea id="searchInput" placeholder="例如輸入: 2AN AMUSE (系統會同時找出這兩個品牌的所有產品)"></textarea>
        <div class="hint">
            <span id="brandCountHint">已輸入: 0 個關鍵字 / 上限 10 個</span>
            <span>支援品牌名或商品名模糊搜尋</span>
        </div>
        <div class="btn-row">
            <button class="btn-search" onclick="performSearch()">立即查詢價格</button>
            <button class="btn-ig-gen" onclick="generateFeaturedPosters()">Generate Featured IG</button>
        </div>
    </div>

    <div class="results-count" id="resultsCount"></div>
    <div class="grid" id="resultsGrid"></div>
</div>

<div id="renderCanvasHidden">
    <div class="ig-poster" id="igPostTemplate">
        <div class="ig-cell" id="igCell0"></div>
        <div class="ig-cell" id="igCell1"></div>
        <div class="ig-cell" id="igCell2"></div>
        <div class="ig-cell" id="igCell3"></div>
    </div>
</div>

<script>
let productsData = [];

const fileInput = document.getElementById('fileInput');
const dropZone = document.getElementById('dropZone');
const uploadStatus = document.getElementById('uploadStatus');
const searchBox = document.getElementById('searchBox');

fileInput.addEventListener('change', function(e) {
    handleFile(e.target.files[0]);
});

dropZone.addEventListener('dragover', function(e) {
    e.preventDefault();
    dropZone.style.background = "#e1f5fe";
});

dropZone.addEventListener('dragleave', function() {
    dropZone.style.background = "#f8fbc9";
});

dropZone.addEventListener('drop', function(e) {
    e.preventDefault();
    dropZone.style.background = "#f8fbc9";
    handleFile(e.dataTransfer.files[0]);
});

function handleFile(file) {
    if (!file) return;

    uploadStatus.innerText = "⏳ 正在解析資料中，請稍候...";

    Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
            productsData = (results.data || []).filter(function(item) {
                return Object.values(item).some(function(value) {
                    return String(value || "").trim() !== "";
                });
            });

            uploadStatus.innerHTML = `✅ <b>成功載入：${file.name}</b> (共匯入 ${productsData.length} 筆商品資料)`;
            dropZone.style.background = "#e8f5e9";
            dropZone.style.border = "2px solid #4caf50";
            searchBox.classList.add('active');
        },
        error: function(err) {
            uploadStatus.innerText = "❌ 解析檔案失敗，請確保是正確的 CSV 格式表格。";
            console.error(err);
        }
    });
}

document.getElementById('searchInput').addEventListener('input', function() {
    let keywords = parseKeywords(this.value);
    let hint = document.getElementById('brandCountHint');
    hint.innerText = `已輸入: ${keywords.length} 個關鍵字 / 上限 10 個`;

    if (keywords.length > 10) {
        hint.style.color = '#e53e3e';
        hint.style.fontWeight = 'bold';
    } else {
        hint.style.color = '#6c757d';
        hint.style.fontWeight = 'normal';
    }
});

function parseKeywords(text) {
    if (!text.trim()) return [];
    return text.split(/[\n,，\s]+/).filter(k => k.trim() !== "");
}

function isFeaturedProduct(product) {
    const value = product["Featured"] || product["featured"] || product["Fetured"] || product["fetured"];
    const text = String(value || "").trim().toLowerCase();
    return text === "y" || text === "yes" || text === "1" || text === "true";
}

function escapeHtml(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function performSearch() {
    const rawInput = document.getElementById('searchInput').value;
    let keywords = parseKeywords(rawInput);

    if (keywords.length === 0) {
        alert("請至少輸入一個品牌或關鍵字。");
        return;
    }

    if (keywords.length > 10) {
        alert("⚠️ 每次最多只能同時查詢 10 個品牌/關鍵字！\n系統將自動抓取前 10 個進行搜尋。");
        keywords = keywords.slice(0, 10);
    }

    const grid = document.getElementById('resultsGrid');
    const countDiv = document.getElementById('resultsCount');
    grid.innerHTML = '';

    const filtered = productsData.filter(product => {
        return keywords.some(keyword => {
            const k = keyword.toLowerCase().trim();
            const brandMatch = product["Brand"] ? product["Brand"].toLowerCase().includes(k) : false;
            const nameMatch = product["Product Name"] ? product["Product Name"].toLowerCase().includes(k) : false;
            return brandMatch || nameMatch;
        });
    });

    countDiv.innerText = `🔍 找到 ${filtered.length} 筆相關商品 (基於 ${keywords.length} 個關鍵字：${keywords.join(', ')})`;

    if (filtered.length === 0) {
        grid.innerHTML = '<div class="no-result">沒有找到相符的商品，請檢查拼字或更換關鍵字。</div>';
        return;
    }

    filtered.forEach(item => {
        const brand = item["Brand"] || "Unknown";
        const name = item["Product Name"] || "無品名";
        const price = item["Price (HKD)"] || "未定價";
        const imgUrl = item["Image"] || "";

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="image-container">
                <img src="${escapeHtml(imgUrl)}" alt="${escapeHtml(name)}" onerror="this.src='https://placehold.co/200x200?text=No+Image'">
            </div>
            <div class="brand-badge">${escapeHtml(brand)}</div>
            <div class="product-name" title="${escapeHtml(name)}">${escapeHtml(name)}</div>
            <div class="price-wrapper">
                <span class="price-label">價格</span>
                <span class="price">HKD $${escapeHtml(price)}</span>
            </div>
        `;
        grid.appendChild(card);
    });
}

function waitForImage(imageElement) {
    return new Promise(function(resolve) {
        if (imageElement.complete) {
            resolve();
            return;
        }
        imageElement.onload = resolve;
        imageElement.onerror = resolve;
    });
}

function buildPosterCell(item) {
    const brand = item["Brand"] || "";
    const name = item["Product Name"] || "";
    const image = item["Image"] || "";
    const price = item["Price (HKD)"] || "";

    return `
        <img
            src="${escapeHtml(image)}"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
            onerror="this.style.display='none';"
        >

        <div class="ig-top-left">
            <div class="ig-brand">${escapeHtml(brand)}</div>
            ${escapeHtml(name)}
        </div>

        <div class="ig-price-box">
            <div class="ig-price">$${escapeHtml(price)}</div>
        </div>
    `;
}

async function generateFeaturedPosters() {
    const targetProducts = productsData.filter(isFeaturedProduct);

    if (targetProducts.length === 0) {
        alert("⚠️ 沒有找到 Featured 產品！\n\n請確保 CSV 的 Featured 欄位填寫：Y、YES、1 或 TRUE。");
        return;
    }

    const pages = Math.ceil(targetProducts.length / 4);

    if (!confirm(`找到 ${targetProducts.length} 件 Featured 產品。\n\n將按產品次序生成 ${pages} 張 1080 x 1350 IG 宣傳圖（每張 4 格）。`)) {
        return;
    }

    for (let index = 0; index < targetProducts.length; index += 4) {
        const chunk = targetProducts.slice(index, index + 4);
        const page = Math.floor(index / 4) + 1;

        for (let cellIndex = 0; cellIndex < 4; cellIndex++) {
            const cell = document.getElementById("igCell" + cellIndex);
            cell.innerHTML = "";
            const item = chunk[cellIndex];
            if (item) cell.innerHTML = buildPosterCell(item);
        }

        const poster = document.getElementById("igPostTemplate");
        const images = poster.querySelectorAll("img");

        await Promise.all(Array.from(images).map(waitForImage));
        await new Promise(resolve => setTimeout(resolve, 250));

        const canvas = await html2canvas(poster, {
            useCORS: true,
            allowTaint: false,
            scale: 1,
            backgroundColor: "#FFFFFF",
            logging: false
        });

        const link = document.createElement("a");
        link.download = `DutyFree_Featured_Part${page}_IG_1080x1350.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
    }

    alert("🎉 Featured 產品的 IG 宣傳圖已全部成功生成並下載！");
}
</script>

</body>
</html>
