<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>韓國免稅店代購 (3 - 7 Jun 2026)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .subtitle {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 20px;
        }

        .warning {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px 16px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #7f8c8d;
            font-size: 16px;
        }

        .search-section {
            margin-bottom: 30px;
        }

        .search-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        .search-section textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            transition: border-color 0.3s;
        }

        .search-section textarea:focus {
            outline: none;
            border-color: #3498db;
        }

        .char-count {
            text-align: right;
            font-size: 12px;
            color: #95a5a6;
            margin-top: 6px;
        }

        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: #2980b9;
        }

        .btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #95a5a6;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .btn-success {
            background: #27ae60;
        }

        .btn-success:hover {
            background: #219a52;
        }

        .results-section {
            margin-top: 30px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .results-title {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        .product-image {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background: #f8f9fa;
            display: block;
        }

        .product-info {
            padding: 16px;
        }

        .product-brand {
            font-size: 12px;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .product-name {
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 12px;
            line-height: 1.4;
            min-height: 44px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-price {
            font-size: 20px;
            font-weight: 700;
            color: #e74c3c;
        }

        .product-price small {
            font-size: 14px;
            font-weight: 400;
            color: #7f8c8d;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #95a5a6;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        /* ===== 新增：長圖容器同圖片處理 ===== */
        .image-stack {
            width: 100%;
            max-width: 100vw;
            margin: 0;
            padding: 0;
            display: block;
            overflow: hidden;
            line-height: 0;
            font-size: 0;
        }

        .image-stack img {
            display: block;
            width: 100%;
            max-width: 100%;
            height: auto;
            margin: 0;
            padding: 0;
            border: 0;
            object-fit: contain;
            vertical-align: top;
        }

        .image-stack img.image-error {
            display: none !important;
        }
        /* ===== 完 ===== */

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 20px;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>韓國免稅店代購 (3 - 7 Jun 2026)</h1>
        <p class="subtitle">每次最多可同時查詢 10 個品牌</p>

        <div class="warning">
            *價格可能會因免稅店的促銷優惠而有所變動，請於落單前與店主確認價格
        </div>

        <div id="loading" class="loading">
            ⏳ 正在連線讀取免稅店產品資料庫，請稍候...
        </div>

        <div id="main-content" style="display: none;">
            <div class="search-section">
                <label for="search-input">請輸入查詢關鍵字（多個請用「空格」或「換行」隔開）：</label>
                <textarea 
                    id="search-input" 
                    placeholder="例如：Apieu Banila Co Beauty of Joseon..."
                    rows="3"
                ></textarea>
                <div class="char-count">
                    已輸入: <span id="char-count">0</span> 個關鍵字 / 上限 10 個
                </div>
                <p style="margin-top: 8px; font-size: 14px; color: #7f8c8d;">
                    支援同時查詢最多 10 個品牌
                </p>
            </div>

            <button id="search-btn" class="btn" disabled>
                🔍 開始查詢
            </button>

            <div id="results-section" class="results-section" style="display: none;">
                <div class="results-header">
                    <div class="results-title">查詢結果</div>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <button id="generate-ig-btn" class="btn btn-secondary">
                            📸 一鍵生成 IG 宣傳圖
                        </button>
                        <button id="clear-btn" class="btn btn-secondary">
                            🗑️ 清除結果
                        </button>
                    </div>
                </div>

                <div id="product-grid" class="product-grid"></div>

                <div id="empty-state" class="empty-state" style="display: none;">
                    <div class="empty-state-icon">📦</div>
                    <div>未找到相關產品</div>
                </div>

                <!-- 新增：長圖容器 -->
                <div id="imageStack" class="image-stack" style="margin-top: 30px;"></div>
            </div>
        </div>
    </div>

    <script>
        // 模擬產品資料庫
        const productDatabase = [
            {
                brand: "Apieu",
                name: "Good Day Cica Calming Sun Cream",
                price: 89,
                image: "https://images.unsplash.com/photo-1556228720-19875c4d84b9?w=400&h=400&fit=crop"
            },
            {
                brand: "Banila Co",
                name: "Clean It Zero Cleansing Balm Original",
                price: 168,
                image: "https://images.unsplash.com/photo-1556228578-8c89e6adf883?w=400&h=400&fit=crop"
            },
            {
                brand: "Beauty of Joseon",
                name: "Relief Sun : Rice + Probiotics SPF50+ PA++++",
                price: 145,
                image: "https://images.unsplash.com/photo-1526947425960-945c6e72858f?w=400&h=400&fit=crop"
            },
            {
                brand: "COSRX",
                name: "Advanced Snail 96 Mucin Power Essence",
                price: 198,
                image: "https://images.unsplash.com/photo-1556228720-19875c4d84b9?w=400&h=400&fit=crop"
            },
            {
                brand: "Dr.Jart+",
                name: "Ceramidin Cream",
                price: 285,
                image: "https://images.unsplash.com/photo-1556228578-8c89e6adf883?w=400&h=400&fit=crop"
            },
            {
                brand: "Etude House",
                name: "Drawing Eye Brow",
                price: 78,
                image: "https://images.unsplash.com/photo-1526947425960-945c6e72858f?w=400&h=400&fit=crop"
            },
            {
                brand: "IOPE",
                name: "Bio Intensive Conditioning Ampoule",
                price: 420,
                image: "https://images.unsplash.com/photo-1556228720-19875c4d84b9?w=400&h=400&fit=crop"
            },
            {
                brand: "Laneige",
                name: "Cream Skin Toner & Moisturizer",
                price: 298,
                image: "https://images.unsplash.com/photo-1556228578-8c89e6adf883?w=400&h=400&fit=crop"
            },
            {
                brand: "Medicube",
                name: "Collagen Gel Cream",
                price: 268,
                image: "https://images.unsplash.com/photo-1526947425960-945c6e72858f?w=400&h=400&fit=crop"
            },
            {
                brand: "Rom&nd",
                name: "Better Than Palette",
                price: 158,
                image: "https://images.unsplash.com/photo-1556228720-19875c4d84b9?w=400&h=400&fit=crop"
            }
        ];

        // DOM 元素
        const loadingEl = document.getElementById('loading');
        const mainContentEl = document.getElementById('main-content');
        const searchInputEl = document.getElementById('search-input');
        const charCountEl = document.getElementById('char-count');
        const searchBtnEl = document.getElementById('search-btn');
        const resultsSectionEl = document.getElementById('results-section');
        const productGridEl = document.getElementById('product-grid');
        const emptyStateEl = document.getElementById('empty-state');
        const generateIgBtnEl = document.getElementById('generate-ig-btn');
        const clearBtnEl = document.getElementById('clear-btn');
        const imageStackEl = document.getElementById('imageStack');

        // 初始化
        setTimeout(() => {
            loadingEl.style.display = 'none';
            mainContentEl.style.display = 'block';
        }, 1500);

        // 關鍵字計數
        searchInputEl.addEventListener('input', () => {
            const value = searchInputEl.value.trim();
            const keywords = value ? value.split(/[\s\n]+/).filter(k => k.length > 0) : [];
            const count = Math.min(keywords.length, 10);
            charCountEl.textContent = count;
            searchBtnEl.disabled = keywords.length === 0 || keywords.length > 10;
        });

        // 查詢功能
        searchBtnEl.addEventListener('click', () => {
            const value = searchInputEl.value.trim();
            const keywords = value ? value.split(/[\s\n]+/).filter(k => k.length > 0) : [];

            if (keywords.length === 0 || keywords.length > 10) {
                alert('請輸入 1-10 個關鍵字');
                return;
            }

            const filteredProducts = productDatabase.filter(product => {
                return keywords.some(keyword => 
                    product.brand.toLowerCase().includes(keyword.toLowerCase()) ||
                    product.name.toLowerCase().includes(keyword.toLowerCase())
                );
            });

            displayResults(filteredProducts);
        });

        // 顯示結果
        function displayResults(products) {
            resultsSectionEl.style.display = 'block';
            productGridEl.innerHTML = '';

            if (products.length === 0) {
                emptyStateEl.style.display = 'block';
                productGridEl.style.display = 'none';
                return;
            }

            emptyStateEl.style.display = 'none';
            productGridEl.style.display = 'grid';

            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img 
                        src="${product.image}" 
                        alt="${product.brand} - ${product.name}"
                        class="product-image"
                        onerror="this.style.display='none'"
                    >
                    <div class="product-info">
                        <div class="product-brand">${product.brand}</div>
                        <div class="product-name">${product.name}</div>
                        <div class="product-price">
                            <small>HKD $</small>${product.price}
                        </div>
                    </div>
                `;
                productGridEl.appendChild(card);
            });
        }

        // 生成 IG 宣傳圖（長圖模式）
        generateIgBtnEl.addEventListener('click', () => {
            const productCards = productGridEl.querySelectorAll('.product-card');
            
            if (productCards.length === 0) {
                alert('未有產品可以生成 IG 圖');
                return;
            }

            // 清空舊圖
            imageStackEl.innerHTML = '';

            productCards.forEach(card => {
                const img = card.querySelector('.product-image');
                if (img && img.src) {
                    addImageToStack(img.src);
                }
            });

            // 自動滾動到長圖位置
            imageStackEl.scrollIntoView({ behavior: 'smooth' });
        });

        // 新增：將圖片加入長圖容器
        function addImageToStack(imageUrl) {
            if (!imageUrl || typeof imageUrl !== 'string') {
                return;
            }

            const img = document.createElement('img');

            // 未成功載入前先隱藏，避免出現 broken image 圖示
            img.style.display = 'none';

            img.onload = function () {
                // 載入成功後先顯示
                img.style.display = 'block';
            };

            img.onerror = function () {
                // 載入失敗：移除圖片，不留任何空位
                img.remove();
            };

            img.src = imageUrl;
            imageStackEl.appendChild(img);
        }

        // 清除結果
        clearBtnEl.addEventListener('click', () => {
            resultsSectionEl.style.display = 'none';
            productGridEl.innerHTML = '';
            imageStackEl.innerHTML = '';
            searchInputEl.value = '';
            charCountEl.textContent = '0';
            searchBtnEl.disabled = true;
        });
    </script>
</body>
</html>
